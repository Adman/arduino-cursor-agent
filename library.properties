name=CursorAgent
version=0.1.0
author=Adrian Matejov <ado.matejov@gmail.com>
maintainer=Adrian Matejov <ado.matejov@gmail.com>
sentence=Cursor Cloud Agents API client for ESP32 (run a prompt on a Cursor cloud agent, get the reply)
paragraph=Creates a no-repo Cursor Cloud Agent via the v1 REST API, polls its run until it finishes, returns the final reply text, then archives or deletes the agent. Cloud agents have internet access, so prompts can ask them to read web pages. Requires WiFi, ArduinoJson, ESP32 HTTPClient / WiFiClientSecure.
category=Communication
url=https://cursor.com/docs/cloud-agent/api/endpoints
architectures=esp32
depends=ArduinoJson
